{% extends "base.html" %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
  <h1 class="h4 mb-3">Новая заявка</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn-primary">Создать</button>
  </form>
</div></div>
{% endblock %}
