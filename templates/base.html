<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Service Desk{% endblock %} · django-2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'tickets:list' %}">Service Desk</a>
    <div class="d-flex gap-3 align-items-center">
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-primary" href="{% url 'tickets:create' %}">+ Заявка</a>
        <span class="text-light small">{{ user }} · {{ user.get_role_display }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Выйти</button></form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
