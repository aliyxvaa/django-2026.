{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <h1 class="h4 mb-3">Вход</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-2"><label class="form-label">Логин</label><input class="form-control" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label">Пароль</label><input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100">Войти</button>
  </form>
</div></div>
{% endblock %}
